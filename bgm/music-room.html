<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星尘山谷音乐室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a sticky "now playing" deck on top, scenes stacked below as rows of track cards, a sticky selection tray at the bottom */
:root{
  --ink:#0f1a14; --panel:#16251c; --panel2:#1e3326; --line:#3f6a48; --fg:#f6f2e2; --dim:#a9b89c;
  --gold:#ffd166; --gild:#c99a45; --cyan:#8fe6ff; --new:#ff9ec7; --parch:#f3e6c4;
  --f-pix:"Press Start 2P","Courier New",monospace;
  --f-head:"ZCOOL QingKe HuangYou","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-body:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.6;padding-inline:16px;padding-block:0 120px;
  background:radial-gradient(1200px 500px at 20% -10%,#1f3a2a 0,transparent 70%),var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto}

header{display:flex;flex-direction:column;gap:6px;padding-block:28px 18px}
.en{font-family:var(--f-pix);font-size:10px;letter-spacing:.4em;color:var(--gold)}
h1{margin:0;font-family:var(--f-head);font-weight:400;font-size:clamp(36px,6vw,54px);letter-spacing:.08em;line-height:1.1;
  background:linear-gradient(#fff 0 35%,#ffe9a8 60%,#f0a83c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(3px 3px 0 #000)}
header p{margin:0;max-width:62ch;color:var(--dim)}

/* now playing deck */
.deck{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-bottom:22px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px 16px;align-items:center;
  background:linear-gradient(#21382a,#16251c);box-shadow:0 0 0 2px #000,0 0 0 4px var(--gild),0 8px 20px rgba(0,0,0,.45)}
.deck .np{min-width:0}
.np-label{font-family:var(--f-pix);font-size:8px;letter-spacing:.15em;color:var(--dim)}
.np-name{font-family:var(--f-head);font-size:22px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.steps i{width:12px;height:12px;background:#24382b;box-shadow:0 0 0 1px #000;transition:background .06s}
.steps i.beat{background:#2e4a36}
.steps i.on{background:var(--gold);box-shadow:0 0 0 1px #000,0 0 8px var(--gold)}
.barno{font-family:var(--f-pix);font-size:9px;color:var(--dim);margin-left:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.deck-ctl{display:flex;align-items:center;gap:10px}
.vol{display:flex;align-items:center;gap:6px;font-family:var(--f-pix);font-size:8px;color:var(--dim)}
.vol input{width:90px;accent-color:var(--gold)}
.btn{border:0;cursor:pointer;padding:8px 14px;font-family:var(--f-head);font-size:17px;letter-spacing:.08em;background:var(--panel2);
  box-shadow:0 0 0 2px #000,0 0 0 4px var(--line);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 0 2px #000,0 0 0 4px var(--gold)}
.btn:disabled{opacity:.4;cursor:default;transform:none}

/* scenes */
section.scene{margin-bottom:34px}
.scene-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.scene-head h2{margin:0;font-family:var(--f-head);font-weight:400;font-size:28px;letter-spacing:.1em;color:var(--parch)}
.scene-head span{color:var(--dim);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;padding:16px 16px 14px;background:linear-gradient(180deg,var(--panel2),var(--panel));
  box-shadow:0 0 0 2px #000,0 0 0 4px var(--line),5px 6px 0 4px rgba(0,0,0,.35);transition:box-shadow .2s,transform .2s;min-width:0}
.card.playing{box-shadow:0 0 0 2px #000,0 0 0 4px var(--gold),0 0 26px 4px rgba(255,209,102,.25),5px 6px 0 4px rgba(0,0,0,.35)}
.card.chosen{box-shadow:0 0 0 2px #000,0 0 0 4px var(--cyan),5px 6px 0 4px rgba(0,0,0,.35)}
.card.playing.chosen{box-shadow:0 0 0 2px #000,0 0 0 4px var(--gold),0 0 0 7px var(--cyan),0 0 26px 4px rgba(255,209,102,.25)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h3{margin:0;font-family:var(--f-head);font-weight:400;font-size:24px;letter-spacing:.06em;line-height:1.2}
.tag{flex:none;font-family:var(--f-pix);font-size:7px;letter-spacing:.12em;padding:4px 6px;background:#000;box-shadow:0 0 0 1px currentColor}
.tag.cur{color:var(--gold)}
.tag.new{color:var(--new)}
.mood{margin:0;color:#e2e8d4;font-size:13.5px;text-wrap:pretty}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta b{font-weight:500;font-size:11.5px;padding:2px 7px;background:#24382b;box-shadow:0 0 0 1px var(--line);color:var(--dim);white-space:nowrap}
.meta b.k{font-family:var(--f-pix);font-size:8px;font-weight:400;color:var(--fg);padding-top:4px}
.card-ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:4px}
.play{display:flex;align-items:center;gap:8px;border:0;cursor:pointer;padding:8px 14px 7px 10px;font-family:var(--f-head);font-size:18px;letter-spacing:.1em;
  background:var(--gold);color:#2a1d0c;box-shadow:0 0 0 2px #000,0 4px 0 2px #9a6b22;transition:transform .12s,box-shadow .12s}
.play:hover{transform:translateY(-2px);box-shadow:0 0 0 2px #000,0 6px 0 2px #9a6b22}
.play:active{transform:translateY(2px);box-shadow:0 0 0 2px #000,0 1px 0 2px #9a6b22}
.play .ico{width:0;height:0;border-left:10px solid #2a1d0c;border-top:6px solid transparent;border-bottom:6px solid transparent}
.card.playing .play{background:var(--parch)}
.card.playing .play .ico{width:10px;height:12px;border:0;background:linear-gradient(90deg,#2a1d0c 0 35%,transparent 35% 65%,#2a1d0c 65%)}
.eq{display:flex;align-items:flex-end;gap:2px;height:16px;opacity:0;transition:opacity .2s}
.card.playing .eq{opacity:1}
.eq i{width:4px;background:var(--gold);height:4px;animation:eq .5s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.2s}.eq i:nth-child(3){animation-delay:-.35s}.eq i:nth-child(4){animation-delay:-.1s}
@keyframes eq{to{height:16px}}
.pick{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--dim);user-select:none}
.pick input{accent-color:var(--cyan);width:16px;height:16px;cursor:pointer}
.card.chosen .pick{color:var(--cyan)}

/* selection tray */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:rgba(15,26,20,.94);box-shadow:0 -2px 0 #000,0 -4px 0 var(--gild)}
.tray-in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.tray-list{flex:1 1 420px;min-width:0;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--dim)}
.tray-list span b{color:var(--fg);font-weight:500}
.tray-list span.unset b{color:#6d7d66}
#copy-msg{font-size:12px;color:var(--cyan);min-width:4em}
#copy-text{position:absolute;left:-9999px}
@media (max-width:640px){.deck{grid-template-columns:1fr}.deck-ctl{justify-content:space-between}.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.eq i{animation:none;height:10px}}
</style>

<div class="wrap">
  <header>
    <div class="en">STARDUST VALE · MUSIC ROOM</div>
    <h1>星尘山谷音乐室</h1>
    <p>每个场景准备了 2 首新曲，和游戏里现在用的版本放在一起。点「试听」播放，觉得合适就勾选「用这首」，最后把底部的选择复制给我，我就把它们写进游戏。所有音乐都由游戏里同一套 8bit 合成器实时演奏。</p>
  </header>

  <div class="deck" aria-live="polite">
    <div class="np">
      <div class="np-label">NOW PLAYING</div>
      <div class="np-name" id="np-name">还没有播放</div>
    </div>
    <div class="steps" id="steps"></div>
    <div class="deck-ctl">
      <label class="vol" for="vol">VOL <input type="range" id="vol" min="0" max="100" value="70"></label>
      <button class="btn" id="stop-btn" disabled>停止</button>
    </div>
  </div>

  <main id="scenes"></main>
</div>

<div class="tray">
  <div class="tray-in">
    <div class="tray-list" id="tray-list"></div>
    <button class="btn" id="copy-btn">复制我的选择</button>
    <span id="copy-msg"></span>
    <textarea id="copy-text" readonly aria-hidden="true" tabindex="-1"></textarea>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ================= notes ================= */
const NOTE_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function midiOf(n) { const m = /^([A-G])([#b]?)(-?\d)$/.exec(n); return 12 * (+m[3] + 1) + NOTE_PC[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0); }
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function chordMidis(name, oct) {
  const m = /^([A-G][#b]?)(m?)(7?)$/.exec(name), root = midiOf(m[1] + oct);
  const iv = m[2] ? [0, 3, 7] : [0, 4, 7]; if (m[3]) iv.push(10);
  return iv.map(i => root + i);
}
function parseBar(str) {
  const ev = []; let at = 0;
  for (const tok of str.trim().split(/\s+/)) { const [n, l] = tok.split(':'); const len = +l; if (n !== 'r') ev.push({ at, m: midiOf(n), len }); at += len; }
  return ev;
}

/* ================= synth (same voices as the game) ================= */
const A = { ac: null, master: null, music: null, echo: null, waves: null, nbuf: null, bus: null };
function initAudio() {
  if (A.ac) { if (A.ac.state === 'suspended') A.ac.resume(); return; }
  const ac = A.ac = new (window.AudioContext || window.webkitAudioContext)();
  A.master = ac.createGain(); A.master.gain.value = .32 * (+$('vol').value / 70);
  const comp = ac.createDynamicsCompressor(); A.master.connect(comp); comp.connect(ac.destination);
  A.music = ac.createGain(); A.music.gain.value = .55; A.music.connect(A.master);
  const d = ac.createDelay(1), fb = ac.createGain(), wet = ac.createGain();
  d.delayTime.value = .27; fb.gain.value = .32; wet.gain.value = .45; d.connect(fb); fb.connect(d); d.connect(wet); wet.connect(A.music); A.echo = d;
  const pulse = duty => { const n = 40, re = new Float32Array(n), im = new Float32Array(n); for (let i = 1; i < n; i++) re[i] = 2 / (i * Math.PI) * Math.sin(i * Math.PI * duty); return ac.createPeriodicWave(re, im); };
  A.waves = { p12: pulse(.125), p25: pulse(.25), p50: pulse(.5) };
  const len = ac.sampleRate; A.nbuf = ac.createBuffer(1, len, ac.sampleRate); const nd = A.nbuf.getChannelData(0); for (let i = 0; i < len; i++) nd[i] = Math.random() * 2 - 1;
}
function inst(kind, f, t, dur, vol, o = {}) {
  const ac = A.ac, osc = ac.createOscillator(), g = ac.createGain();
  if (A.waves[kind]) osc.setPeriodicWave(A.waves[kind]); else osc.type = kind;
  osc.frequency.setValueAtTime(f, t);
  if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
  const att = o.att ?? .006, rel = o.rel ?? .04, sus = o.sus ?? .7;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + att);
  g.gain.setTargetAtTime(vol * sus, t + att, o.dec ?? .08);
  g.gain.setValueAtTime(vol * sus, t + dur); g.gain.linearRampToValueAtTime(0, t + dur + rel);
  if (o.vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = 5.2; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * .01, t + .25); l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + dur + rel + .05); }
  osc.connect(g); g.connect(A.bus); if (o.echo) g.connect(A.echo);
  osc.start(t); osc.stop(t + dur + rel + .05);
}
function noise(t, vol, type, freq, len) {
  const ac = A.ac, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = A.nbuf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + len);
  s.connect(f); f.connect(g); g.connect(A.bus); s.start(t, Math.random() * .5); s.stop(t + len + .02);
}
function drum(kind, t, vol) {
  const ac = A.ac;
  if (kind === 'kick' || kind === 'tom') {
    const o = ac.createOscillator(), g = ac.createGain(); if (kind === 'tom') o.type = 'triangle';
    o.frequency.setValueAtTime(kind === 'kick' ? 150 : 220, t); o.frequency.exponentialRampToValueAtTime(kind === 'kick' ? 42 : 90, t + (kind === 'kick' ? .14 : .16));
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + (kind === 'kick' ? .2 : .18));
    o.connect(g); g.connect(A.bus); o.start(t); o.stop(t + .22); return;
  }
  if (kind === 'snare') { noise(t, vol, 'bandpass', 1900, .13); inst('triangle', 190, t, .05, vol * .6, { rel: .05, sus: .2, dec: .03 }); return; }
  if (kind === 'clap') { noise(t, vol, 'bandpass', 1200, .05); noise(t + .012, vol * .8, 'bandpass', 1200, .09); return; }
  if (kind === 'rim') { noise(t, vol, 'highpass', 3000, .02); inst('square', 1700, t, .015, vol * .25, { rel: .01, sus: .1 }); return; }
  noise(t, vol, 'highpass', 7000, kind === 'ohat' ? .12 : .035);
}

/* ================= generic arranger for the new tracks ================= */
const DK = { k: 'kick', s: 'snare', h: 'hat', o: 'ohat', t: 'tom', c: 'clap', r: 'rim' };
const DV = { k: .3, s: .13, h: .018, o: .02, t: .2, c: .09, r: .08 };
function arrStep(T, bar, s, t, sd) {
  const L = T.layers, spb = T.spb, chord = T.chords[bar % T.chords.length], half = bar >= T.bars.length / 2;
  const bassNote = (ch, st, root) => st === 'f' ? root + 7 : st === 'o' ? root + 12 : st === 't' ? ch[1] : st === 'l' ? root - 12 : root;
  if (L.bass) {
    const b = L.bass, st = b.pat[s];
    if (st && st !== '.') {
      const ch = chordMidis(chord, b.oct ?? 2), m = bassNote(ch, st, ch[0]);
      inst(b.wave || 'triangle', hz(m), t, sd * (b.len || 1.6), b.vol ?? .2, { sus: b.sus ?? .55, rel: .04 });
      if (b.layer2) inst(b.layer2.wave, hz(m + (b.layer2.iv || 0)), t, sd * (b.len || 1.6) * .8, b.layer2.vol, { sus: .4, rel: .03 });
    }
  }
  if (L.stab && L.stab.pat[s] === 'x') { const c = chordMidis(chord, L.stab.oct ?? 4); for (const m of c.slice(0, 3)) inst(L.stab.wave || 'p25', hz(m), t, sd * (L.stab.len || .7), L.stab.vol ?? .016, { sus: .3, dec: .03, rel: .02 }); }
  if (L.arp && bar >= (L.arp.from || 0) && s % (L.arp.every || 1) === 0) {
    const c = chordMidis(chord, L.arp.oct ?? 5), seq = L.arp.seq || [0, 1, 2, 1], idx = seq[Math.floor(s / (L.arp.every || 1)) % seq.length];
    inst(L.arp.wave || 'p12', hz(c[idx % c.length] + 12 * Math.floor(idx / c.length)), t, sd * (L.arp.len || .8), L.arp.vol ?? .03, { echo: L.arp.echo, sus: .25, dec: .05, rel: .06 });
  }
  if (L.pad && s === 0 && bar >= (L.pad.from || 0)) for (const m of chordMidis(chord, L.pad.oct ?? 4)) inst(L.pad.wave || 'sine', hz(m), t, sd * spb * .95, L.pad.vol ?? .02, { att: L.pad.att ?? .2, sus: .9, rel: .3, vib: L.pad.vib });
  if (L.lead) {
    const ld = half && L.lead.alt ? L.lead.alt : L.lead;
    for (const e of T.bars[bar]) if (e.at === s) {
      inst(ld.wave, hz(e.m + (ld.oct || 0)), t, sd * e.len * (ld.len || .9), ld.vol, { vib: ld.vib && e.len >= 4, echo: ld.echo, sus: ld.sus ?? .7, dec: ld.dec ?? .08, att: ld.att ?? .01, rel: ld.rel ?? .06 });
      if (ld.double) inst(ld.double.wave, hz(e.m + (ld.oct || 0) + ld.double.iv), t, sd * e.len * (ld.len || .9), ld.double.vol, { sus: .6, rel: .05 });
    }
  }
  const D = L.drums;
  if (D && bar >= (D.from || 0)) {
    const fe = D.fillEvery || 4, fill = D.fill && bar % fe === fe - 1;
    for (const k in DK) { const pat = (fill && D.fill[k]) || D[k]; const ch = pat && pat[s]; if (ch && ch !== '.') drum(DK[k], t, ((D.v && D.v[k]) || DV[k]) * (ch === 'X' ? 1.4 : ch === 'x' ? 1 : .55)); }
  }
  if (T.extra) T.extra(bar, s, t, sd);
}

/* ================= the current in-game tracks, ported as-is ================= */
const LEGACY = {
  title: { chords: ['G', 'D', 'Em', 'C', 'G', 'C', 'Am', 'D', 'G', 'D', 'Em', 'Bm', 'C', 'G', 'Am', 'D7'],
    lead: ['B4:4 D5:4 G5:6 F#5:2', 'A5:6 G5:2 F#5:4 D5:4', 'E5:4 G5:4 B5:6 A5:2', 'G5:8 E5:4 C5:4', 'D5:4 G5:4 B5:4 A5:2 G5:2', 'E5:6 G5:2 C6:4 B5:4', 'A5:4 C6:4 E5:4 A5:4', 'F#5:8 A5:4 D5:4', 'B5:6 A5:2 G5:4 D5:4', 'F#5:4 A5:4 D6:6 C6:2', 'B5:4 G5:4 E5:6 G5:2', 'F#5:8 D5:4 B4:4', 'C5:4 E5:4 G5:4 C6:4', 'B5:6 A5:2 G5:4 D5:4', 'E5:4 A5:4 C6:4 B5:4', 'A5:4 F#5:4 D5:4 F#5:4'] },
  battle: { chords: ['C', 'Am', 'F', 'G', 'C', 'Am', 'Dm', 'G', 'F', 'G', 'Em', 'Am', 'Dm', 'G', 'C', 'C'],

  T.chords = src.chords; T.bars = src.lead.map(parseBar); T.spb = T.spb || 16;
  // 8-bar melodies play twice: plain first, then the variation (alt lead, extra layers)
  if (!T.legacy && T.bars.length === 8 && T.scene !== 'pick') T.bars = T.bars.concat(T.bars);
}

/* ================= player ================= */
const P = { cur: null, step: 0, next: 0, timer: null };
function play(id) {
  initAudio();
  const ac = A.ac, now = ac.currentTime;
  if (A.bus) { const old = A.bus; old.gain.cancelScheduledValues(now); old.gain.setValueAtTime(old.gain.value, now); old.gain.linearRampToValueAtTime(0, now + .3); setTimeout(() => old.disconnect(), 1200); }
  if (P.cur === id) { P.cur = null; A.bus = null; render(); return; }
  A.bus = ac.createGain(); A.bus.gain.setValueAtTime(0, now); A.bus.gain.linearRampToValueAtTime(1, now + .25); A.bus.connect(A.music);
  P.cur = id; P.step = 0; P.next = now + .08;
  buildSteps(); render();
}
function stop() {
  if (!A.ac || !A.bus) { P.cur = null; render(); return; }
  const now = A.ac.currentTime, old = A.bus; old.gain.cancelScheduledValues(now); old.gain.setValueAtTime(old.gain.value, now); old.gain.linearRampToValueAtTime(0, now + .3); setTimeout(() => old.disconnect(), 1200);
  A.bus = null; P.cur = null; render();
}
const byId = id => TRACKS.find(t => t.id === id);
setInterval(() => {
  if (!A.ac || !P.cur || A.ac.state !== 'running') return;
  const T = byId(P.cur), sd = 60 / T.bpm / 4, total = T.bars.length * T.spb;
  if (P.next < A.ac.currentTime - .5) P.next = A.ac.currentTime + .05;
  while (P.next < A.ac.currentTime + .15) {
    const bar = Math.floor(P.step / T.spb), s = P.step % T.spb;
    if (T.legacy) legacyStep(T.legacy, T, bar, s, P.next, sd); else arrStep(T, bar, s, P.next, sd);
    const at = P.next, st = P.step; setTimeout(() => lightStep(st), Math.max(0, (at - A.ac.currentTime) * 1000));
    P.next += sd; P.step = (P.step + 1) % total;
  }
}, 25);

/* ================= ui ================= */
let chosen = {};
try { chosen = JSON.parse(localStorage.getItem('sv-bgm-choice') || '{}') || {}; } catch (e) { chosen = {}; }
function saveChoice() { try { localStorage.setItem('sv-bgm-choice', JSON.stringify(chosen)); } catch (e) {} }
function buildPage() {
  const root = $('scenes');
  for (const sc of SCENES) {
    const sec = document.createElement('section'); sec.className = 'scene';
    sec.innerHTML = `<div class="scene-head"><h2>${sc.name}</h2><span>${sc.where}</span></div><div class="grid"></div>`;
    const grid = sec.querySelector('.grid');
    for (const T of TRACKS.filter(t => t.scene === sc.id)) {
      const c = document.createElement('article'); c.className = 'card'; c.id = 'card-' + T.id;
      c.innerHTML = `<div class="card-top"><h3>${T.name}</h3><span class="tag ${T.cur ? 'cur' : 'new'}">${T.cur ? 'CURRENT' : 'NEW'}</span></div>
        <p class="mood">${T.mood}</p>
        <div class="meta"><b>${T.key}</b><b class="k">${T.bpm} BPM</b>${T.ins.map(i => `<b>${i}</b>`).join('')}</div>
        <div class="card-ctl">
          <button class="play" id="play-${T.id}"><span class="ico"></span><span class="lbl">试听</span></button>
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <label class="pick" for="pick-${T.id}"><input type="radio" name="pick-${sc.id}" id="pick-${T.id}" value="${T.id}"> 用这首</label>
        </div>`;
      c.querySelector('.play').addEventListener('click', () => play(T.id));
      const r = c.querySelector('input'); r.checked = chosen[sc.id] === T.id;
      r.addEventListener('change', () => { chosen[sc.id] = T.id; saveChoice(); render(); });
      grid.appendChild(c);
    }
    root.appendChild(sec);
  }
}
function buildSteps() {
  const T = P.cur && byId(P.cur), n = T ? T.spb : 16, el = $('steps');
  el.innerHTML = Array.from({ length: n }, (_, i) => `<i class="${i % 4 === 0 ? 'beat' : ''}"></i>`).join('') + '<span class="barno" id="barno"></span>';
}
function lightStep(st) {
  const T = P.cur && byId(P.cur); if (!T) return;
  const cells = $('steps').querySelectorAll('i'), s = st % T.spb;
  cells.forEach((c, i) => c.classList.toggle('on', i === s));
  const b = $('barno'); if (b) b.textContent = `BAR ${String(Math.floor(st / T.spb) + 1).padStart(2, '0')}/${String(T.bars.length).padStart(2, '0')}`;
}
function render() {
  for (const T of TRACKS) {
    const c = $('card-' + T.id), on = P.cur === T.id;
    c.classList.toggle('playing', on); c.classList.toggle('chosen', chosen[T.scene] === T.id);
    c.querySelector('.lbl').textContent = on ? '暂停' : '试听';
  }
  const T = P.cur && byId(P.cur);
  $('np-name').textContent = T ? `${SCENES.find(s => s.id === T.scene).name} · ${T.name}` : '还没有播放';
  $('stop-btn').disabled = !T;
  if (!T) $('steps').querySelectorAll('i').forEach(c => c.classList.remove('on'));
  $('tray-list').innerHTML = SCENES.map(sc => { const t = chosen[sc.id] && byId(chosen[sc.id]); return `<span class="${t ? '' : 'unset'}">${sc.name}：<b>${t ? t.name : '未选'}</b></span>`; }).join('');
}
function choiceText() { return 'BGM 选择 — ' + SCENES.map(sc => { const t = chosen[sc.id] && byId(chosen[sc.id]); return `${sc.name}：${t ? t.name : '保持现状'}`; }).join('；'); }
$('copy-btn').addEventListener('click', () => {
  const text = choiceText(), msg = $('copy-msg');
  const fallback = () => { const ta = $('copy-text'); ta.value = text; ta.select(); try { document.execCommand('copy'); msg.textContent = '已复制'; } catch (e) { msg.textContent = '请手动复制'; } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => { msg.textContent = '已复制'; }, fallback); else fallback();
  setTimeout(() => { msg.textContent = ''; }, 2500);
});
$('stop-btn').addEventListener('click', stop);
$('vol').addEventListener('input', () => { if (A.master) A.master.gain.value = .32 * (+$('vol').value / 70); });
buildPage(); buildSteps(); render();
</script>
