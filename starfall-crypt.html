<title>星尘山谷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: full-bleed canvas stage; HUD pinned to corners; menus are centered pixel-framed panels */
:root{
  --ink:#0f1a14; --panel:#16251c; --panel2:#1e3326; --line:#3f6a48;
  --fg:#f6f2e2; --dim:#a8b89c; --arc:#8fe6ff; --vio:#c4a6ff; --gold:#ffd166; --blood:#ff4d6d;
  --f-pix:"Press Start 2P", "Courier New", monospace;
  --f-head:"ZCOOL QingKe HuangYou", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --f-body:"Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--fg);overflow:hidden;font-family:var(--f-body);user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;background:var(--ink)}
body.playing #game{cursor:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--arc);outline-offset:3px}

/* ---------- pixel frame ---------- */
.px{background:var(--panel);box-shadow:
  0 0 0 2px var(--ink),0 0 0 4px var(--line),0 0 0 6px var(--ink),
  6px 6px 0 6px rgba(0,0,0,.45);}
.btn{font-family:var(--f-head);font-size:26px;letter-spacing:.12em;padding:12px 34px 10px;background:var(--panel2);border:0;cursor:pointer;
  box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--gold),0 4px 0 4px #9a6b22;transition:transform .15s cubic-bezier(.3,1.6,.5,1),box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-3px);background:#28432f;box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--arc),0 7px 0 4px #2d7f99,0 0 30px 4px rgba(122,231,255,.25)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--arc),0 1px 0 4px #2d7f99}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;--gild:#c99a45;--parch:#f3e6c4;--parch2:#dcc690;--wood:#3b2a1c}
#hud.on{opacity:1}
.hud-tl{position:absolute;left:18px;top:calc(18px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:14px;transform:translateX(-30px);opacity:0;transition:transform .6s cubic-bezier(.2,1.3,.4,1),opacity .4s}
#hud.on .hud-tl,#hud.on .hud-tc,#hud.on .hud-tr{transform:none;opacity:1}
/* hero nameplate */
#plate{position:relative;display:flex;align-items:center;gap:12px;padding:6px 16px 6px 6px;background:linear-gradient(#21382a,#16251c);
  box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--gild),0 0 0 6px var(--ink),5px 6px 0 6px rgba(0,0,0,.3)}
#plate::before,#plate::after{content:"";position:absolute;width:8px;height:8px;background:var(--gold);box-shadow:0 0 0 2px var(--ink);transform:rotate(45deg)}
#plate::before{left:-7px;top:-7px}#plate::after{right:-7px;bottom:-7px}
.face{position:relative;width:72px;height:72px;flex:none;background:radial-gradient(circle at 40% 35%,#fff1c4,#f3b65a 55%,#a36e24);
  box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--gold),inset 0 0 0 2px rgba(255,255,255,.35);overflow:hidden}
.face canvas{display:block;width:72px;height:72px;image-rendering:pixelated}
.face::after{content:"";position:absolute;inset:0;background:var(--blood);opacity:0;mix-blend-mode:multiply}
#plate.hurt .face{animation:faceHurt .38s}
#plate.hurt .face::after{animation:faceRed .38s}
@keyframes faceHurt{0%{transform:translate(-4px,1px)}25%{transform:translate(4px,-1px)}50%{transform:translate(-3px,0)}75%{transform:translate(2px,0)}100%{transform:none}}
@keyframes faceRed{0%{opacity:.85}100%{opacity:0}}
#plate.low .face{animation:lowPulse .9s ease-in-out infinite}
@keyframes lowPulse{50%{box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--blood),0 0 20px 6px rgba(255,77,109,.55)}}
.plate-body{display:flex;flex-direction:column;gap:6px}
.plate-name{display:flex;align-items:baseline;gap:10px;font-family:var(--f-head);font-size:19px;letter-spacing:.12em;color:#fff3c4;text-shadow:2px 2px 0 var(--ink)}
.plate-name span{font-family:var(--f-pix);font-size:8px;letter-spacing:.08em;color:var(--gold)}
#hearts{display:flex;gap:4px;flex-wrap:wrap;max-width:230px}
#hearts img{width:27px;height:24px;image-rendering:pixelated;transition:transform .25s cubic-bezier(.3,1.8,.5,1),filter .25s}
#hearts img.lost{filter:grayscale(1) brightness(.45)}
#hearts img.pop{transform:scale(1.4)}
/* skill slots */
.skills{display:flex;gap:14px;padding-left:4px}
.slot{--c:#8fe6ff;--p:1;position:relative;width:50px;height:50px;display:grid;place-items:center;background:#122019;
  box-shadow:0 0 0 2px var(--ink),0 0 0 4px #3f6a48,4px 5px 0 4px rgba(0,0,0,.3);transition:box-shadow .3s}
.slot .ico{width:42px;height:42px;image-rendering:pixelated;filter:grayscale(.8) brightness(.55);transition:filter .3s}
.slot.ready .ico{filter:none}
.slot.ready{box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--c),0 0 16px 2px color-mix(in srgb,var(--c) 45%,transparent),4px 5px 0 4px rgba(0,0,0,.3)}
.slot .sweep{position:absolute;inset:0;background:conic-gradient(transparent calc(var(--p)*360deg),rgba(6,14,9,.66) 0)}
.slot .key{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);padding:2px 5px;font-family:var(--f-pix);font-size:7px;font-weight:400;color:#fff3c4;background:var(--ink);box-shadow:0 0 0 1px var(--gild);white-space:nowrap}
.slot.flash::after{content:"";position:absolute;inset:-3px;box-shadow:0 0 0 3px #fff;animation:slotFlash .45s ease-out forwards}
@keyframes slotFlash{from{opacity:1;transform:scale(.92)}to{opacity:0;transform:scale(1.3)}}
.slot .pips{position:absolute;top:-7px;right:-7px;display:flex;gap:4px}
.slot .pips i{width:8px;height:8px;transform:rotate(45deg);background:#25382b;box-shadow:0 0 0 2px var(--ink)}
.slot .pips i.on{background:var(--c);box-shadow:0 0 0 2px var(--ink),0 0 8px var(--c)}
.slot.form{width:auto;grid-template-columns:42px auto;gap:8px;padding:0 12px 0 4px}
.slot-name{font-family:var(--f-head);font-size:17px;letter-spacing:.06em;color:var(--c);text-shadow:2px 2px 0 var(--ink);white-space:nowrap}
/* quest scroll */
.hud-tc{position:absolute;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-30px);opacity:0;transition:transform .6s .08s cubic-bezier(.2,1.3,.4,1),opacity .4s .08s}
#hud.on .hud-tc{transform:translateX(-50%)}
.quest{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:260px;padding:8px 30px 10px;color:var(--wood);
  background:linear-gradient(var(--parch),var(--parch2));box-shadow:0 0 0 2px var(--ink),4px 6px 0 2px rgba(0,0,0,.28)}
.quest::before,.quest::after{content:"";position:absolute;top:-6px;bottom:-6px;width:12px;background:linear-gradient(90deg,#7a4c26,#cf9a5c 45%,#7a4c26);box-shadow:0 0 0 2px var(--ink)}
.quest::before{left:-9px}.quest::after{right:-9px}
.quest-row{display:flex;align-items:center;gap:8px}
.quest-ico{width:16px;height:16px;flex:none;background:var(--wood);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
#obj-label{font-family:var(--f-head);font-size:21px;letter-spacing:.08em;color:var(--wood);white-space:nowrap}
#obj-label b{margin-left:8px;font-family:var(--f-pix);font-size:11px;font-weight:400;color:#a3461c}
.bar{position:relative;width:100%;height:10px;overflow:hidden}
.bar i{position:absolute;inset:0;width:0;transition:width .35s cubic-bezier(.2,.9,.3,1)}
.quest .bar{background:#c4a96c;box-shadow:0 0 0 2px var(--wood)}
.quest .bar i{background:linear-gradient(#ffe58a,#e09a2c)}
.quest .bar i::after{content:"";position:absolute;top:0;bottom:0;width:26px;left:-26px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);animation:barShine 2.4s linear infinite}
@keyframes barShine{to{left:100%}}
.quest .bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(59,42,28,.35) calc(10% - 2px) 10%)}
.quest.bump{animation:questBump .25s}
@keyframes questBump{50%{transform:scale(1.04)}}
/* route map */
.hud-tr{position:absolute;right:18px;top:calc(18px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:auto;transform:translateX(30px);opacity:0;transition:transform .6s .12s cubic-bezier(.2,1.3,.4,1),opacity .4s .12s}
.route-box{display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding:8px 12px;background:rgba(15,26,20,.78);box-shadow:0 0 0 2px var(--ink),0 0 0 4px #3f6a48}
#route{display:flex;align-items:center}
#route .link{width:12px;height:2px;background:#3f6a48}
#route .link.done{background:var(--gold)}
#route .node{width:9px;height:9px;transform:rotate(45deg);background:#2a3f30;box-shadow:0 0 0 2px var(--ink)}
#route .node.done{background:var(--gold)}
#route .node.cur{background:#8fe6ff;animation:nodePulse 1s ease-in-out infinite}
#route .node.boss{width:13px;height:13px;background:#5a3f8a}
#route .node.boss.cur{background:var(--blood)}
@keyframes nodePulse{50%{box-shadow:0 0 0 2px var(--ink),0 0 10px 3px rgba(143,230,255,.8)}}
#route-name{font-family:var(--f-pix);font-size:8px;letter-spacing:.08em;color:#fff3c4;white-space:nowrap}
#route-name em{font-style:normal;font-family:var(--f-head);font-size:15px;letter-spacing:.1em;margin-left:6px;color:var(--gold)}
.hud-btns{display:flex;gap:8px}
.icon-btn{width:34px;height:34px;border:0;cursor:pointer;background:rgba(15,26,20,.78);box-shadow:0 0 0 2px var(--ink),0 0 0 4px #3f6a48;font-family:var(--f-pix);font-size:10px;color:var(--fg);transition:box-shadow .2s,transform .2s}
.icon-btn:hover{box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--gold);transform:translateY(-2px)}
/* kill combo */
#combo{position:absolute;right:26px;top:36%;display:grid;justify-items:end;gap:2px;opacity:0;transform:translateX(40px);transition:opacity .25s,transform .4s cubic-bezier(.2,1.4,.4,1)}
#combo.on{opacity:1;transform:none}
#combo-num{font-family:var(--f-pix);font-size:34px;line-height:1;color:#fff3c4;text-shadow:3px 3px 0 var(--ink),0 0 16px rgba(255,209,102,.6)}
#combo-num.pop{animation:cPop .2s ease-out}
#combo.t2 #combo-num{color:#ffd166}
#combo.t3 #combo-num{color:#ff9d3d}
#combo.t4 #combo-num{color:#ff7ac8;text-shadow:3px 3px 0 var(--ink),0 0 22px rgba(255,122,200,.8)}
@keyframes cPop{0%{transform:scale(1.4)}100%{transform:none}}
.c-lbl{font-family:var(--f-head);font-size:18px;letter-spacing:.3em;color:var(--gold);text-shadow:2px 2px 0 var(--ink)}
#combo-word{font-family:var(--f-head);font-size:30px;color:#ff7ac8;text-shadow:3px 3px 0 var(--ink);opacity:0;white-space:nowrap}
#combo-word.show{animation:cWord 1.5s ease-out}
@keyframes cWord{0%{opacity:0;transform:scale(2.2) rotate(-10deg)}14%{opacity:1;transform:scale(1) rotate(-4deg)}80%{opacity:1}100%{opacity:0;transform:translateY(-12px) rotate(-4deg)}}
.c-bar{display:block;width:96px;height:4px;background:rgba(15,26,20,.75);box-shadow:0 0 0 1px var(--ink)}
.c-bar b{display:block;height:100%;width:100%;background:var(--gold)}
/* ability toast */
#toast{position:absolute;right:18px;top:calc(110px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px;max-width:310px;padding:10px 16px 10px 10px;
  background:linear-gradient(#21382a,#16251c);box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--gold),5px 6px 0 4px rgba(0,0,0,.3);transform:translateX(calc(100% + 40px));transition:transform .55s cubic-bezier(.2,1.3,.4,1)}
#toast.on{transform:none}
#toast canvas{width:42px;height:42px;flex:none;image-rendering:pixelated;filter:drop-shadow(0 0 8px rgba(143,230,255,.7))}
#toast-t{display:block;font-family:var(--f-head);font-size:21px;letter-spacing:.1em;color:var(--gold);text-shadow:2px 2px 0 var(--ink)}
#toast-d{display:block;font-size:12px;line-height:1.5;color:var(--fg)}
/* boss */
#boss{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(580px,calc(100% - 32px));display:flex;flex-direction:column;align-items:center;gap:8px;transition:opacity .6s,transform .6s}
#boss.hide{opacity:0;transform:translate(-50%,20px)}
.boss-name{font-family:var(--f-head);font-size:24px;letter-spacing:.3em;color:#ffb3c6;text-shadow:2px 2px 0 var(--ink),0 0 18px rgba(255,77,109,.6)}
.boss-name::before,.boss-name::after{content:"✦";margin:0 10px;color:var(--blood);font-size:14px;vertical-align:4px}
.boss-bar{height:14px;background:#1a0f1c;box-shadow:0 0 0 2px var(--ink),0 0 0 4px #7a2a44,0 0 0 6px var(--ink)}
.boss-bar i{background:linear-gradient(#ff7a93,#c22c55);z-index:2;transition:width .12s}
.boss-bar b{position:absolute;inset:0;width:100%;background:#fff3c4;transition:width .8s .25s cubic-bezier(.3,.8,.3,1)}
#keyq{position:absolute;right:24px;bottom:calc(26px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;padding:12px 14px 18px;background:rgba(30,16,40,.9);box-shadow:0 0 0 2px var(--ink),0 0 0 4px #ff7ab0,0 6px 18px rgba(0,0,0,.5);opacity:0;transform:translateY(24px) scale(.85);transition:opacity .12s,transform .25s cubic-bezier(.2,1.5,.4,1),box-shadow .2s}
#keyq.on{opacity:1;transform:none}
#keyq kbd{width:46px;height:46px;display:grid;place-items:center;font-family:var(--f-pix);font-size:20px;color:#fff;background:linear-gradient(#6a447f,#33204a);box-shadow:0 0 0 2px var(--ink),0 5px 0 2px #1a1028;transition:transform .07s,background .07s,box-shadow .07s}
#keyq kbd:nth-child(2){order:2}#keyq .plus{order:1;font-family:var(--f-pix);font-size:14px;color:#ffc2dc}
#keyq kbd.down{transform:translateY(4px);background:linear-gradient(#ff9ec7,#d9558f);box-shadow:0 0 0 2px var(--ink),0 1px 0 2px #1a1028}
#keyq i{position:absolute;left:10px;right:10px;bottom:7px;height:4px;background:#ff7ab0;transform-origin:left;box-shadow:0 0 6px #ff7ab0}
#keyq.ok{box-shadow:0 0 0 2px var(--ink),0 0 0 4px #7dffb0,0 0 26px #7dffb0}#keyq.ok i{background:#7dffb0}
#keyq.miss{opacity:0;transform:translateY(10px) scale(.92);transition:opacity .4s,transform .4s}
/* last-stand badge */
#escape{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-head);font-weight:400;font-size:13px;letter-spacing:.08em;color:var(--gold);transition:color .4s}
#escape::before{content:"";width:6px;height:6px;transform:rotate(45deg);background:var(--gold);box-shadow:0 0 0 1px var(--ink),0 0 6px var(--gold);transition:background .4s,box-shadow .4s}
#escape.used{color:#5f6e5f;text-decoration:line-through}
#escape.used::before{background:#33443a;box-shadow:0 0 0 1px var(--ink)}
/* frame ornaments: small gilt corner brackets and a centre tick, kept quiet on purpose */
#hud{--orn-c:rgba(233,193,112,.8);
  --orn:linear-gradient(var(--orn-c) 0 0) left 3px top 3px/9px 2px no-repeat,linear-gradient(var(--orn-c) 0 0) left 3px top 3px/2px 9px no-repeat,
    linear-gradient(var(--orn-c) 0 0) right 3px top 3px/9px 2px no-repeat,linear-gradient(var(--orn-c) 0 0) right 3px top 3px/2px 9px no-repeat,
    linear-gradient(var(--orn-c) 0 0) left 3px bottom 3px/9px 2px no-repeat,linear-gradient(var(--orn-c) 0 0) left 3px bottom 3px/2px 9px no-repeat,
    linear-gradient(var(--orn-c) 0 0) right 3px bottom 3px/9px 2px no-repeat,linear-gradient(var(--orn-c) 0 0) right 3px bottom 3px/2px 9px no-repeat;
  --orn-s:linear-gradient(var(--orn-c) 0 0) left 2px top 2px/6px 1px no-repeat,linear-gradient(var(--orn-c) 0 0) left 2px top 2px/1px 6px no-repeat,
    linear-gradient(var(--orn-c) 0 0) right 2px top 2px/6px 1px no-repeat,linear-gradient(var(--orn-c) 0 0) right 2px top 2px/1px 6px no-repeat,
    linear-gradient(var(--orn-c) 0 0) left 2px bottom 2px/6px 1px no-repeat,linear-gradient(var(--orn-c) 0 0) left 2px bottom 2px/1px 6px no-repeat,
    linear-gradient(var(--orn-c) 0 0) right 2px bottom 2px/6px 1px no-repeat,linear-gradient(var(--orn-c) 0 0) right 2px bottom 2px/1px 6px no-repeat;
  --orn-m:linear-gradient(var(--orn-c) 0 0) center top 4px/26px 1px no-repeat,linear-gradient(var(--orn-c) 0 0) center top 3px/4px 3px no-repeat,
    linear-gradient(var(--orn-c) 0 0) center bottom 4px/26px 1px no-repeat,linear-gradient(var(--orn-c) 0 0) center bottom 3px/4px 3px no-repeat;
  --wood-l:rgba(59,42,28,.45)}
#plate{background:var(--orn),linear-gradient(#21382a,#16251c)}
.slot{background:var(--orn-s),#122019}
.route-box{background:var(--orn-s),rgba(15,26,20,.78)}
.icon-btn{background:var(--orn-s),rgba(15,26,20,.78)}
#toast{background:var(--orn),var(--orn-m),linear-gradient(#21382a,#16251c)}
#keyq{background:var(--orn),rgba(30,16,40,.9)}
/* the quest scroll gets a thin inked inner border with corner dots, like a printed page */
.quest{background:
  linear-gradient(var(--wood-l) 0 0) left 6px top 4px/calc(100% - 12px) 1px no-repeat,linear-gradient(var(--wood-l) 0 0) left 6px bottom 4px/calc(100% - 12px) 1px no-repeat,
  linear-gradient(var(--wood-l) 0 0) left 4px top 6px/1px calc(100% - 12px) no-repeat,linear-gradient(var(--wood-l) 0 0) right 4px top 6px/1px calc(100% - 12px) no-repeat,
  linear-gradient(var(--wood) 0 0) left 3px top 3px/3px 3px no-repeat,linear-gradient(var(--wood) 0 0) right 3px top 3px/3px 3px no-repeat,
  linear-gradient(var(--wood) 0 0) left 3px bottom 3px/3px 3px no-repeat,linear-gradient(var(--wood) 0 0) right 3px bottom 3px/3px 3px no-repeat,
  linear-gradient(var(--parch),var(--parch2))}
.c-bar{position:relative}
.c-bar::before,.c-bar::after{content:"";position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 0 1px var(--ink)}
.c-bar::before{left:-8px}.c-bar::after{right:-8px}
#hints{position:absolute;left:18px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--fg);line-height:1.8;text-shadow:1px 1px 0 var(--ink);transition:opacity 1s}
#hints kbd{font-family:var(--f-pix);font-size:8px;color:var(--fg);padding:2px 4px;background:#24382b;box-shadow:0 0 0 1px var(--line)}
@media (max-width:760px){.hud-tc{top:calc(150px + env(safe-area-inset-top,0px))}.quest{min-width:200px}#route-name em{display:none}#hints{display:none}}



/* ---------- banner + hurt ---------- */
#banner{position:fixed;left:0;right:0;top:30%;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;text-align:center;padding-inline:16px}
#banner .t1{font-family:var(--f-pix);font-size:11px;letter-spacing:.3em;color:#fff3c4;text-shadow:2px 2px 0 var(--ink)}
#banner .t2{font-family:var(--f-head);font-size:clamp(34px,6vw,58px);letter-spacing:.14em;text-shadow:3px 3px 0 var(--ink),0 0 30px rgba(255,214,120,.5)}
#banner .t3{font-size:15px;color:var(--fg);background:rgba(15,26,20,.78);padding:6px 14px;box-shadow:0 0 0 2px var(--line)}
#banner > *{opacity:0}
#banner.show > *{animation:bannerIn 2.8s cubic-bezier(.2,.9,.25,1) both}
#banner.show .t2{animation-delay:.08s}
#banner.show .t3{animation-delay:.18s}
#banner.clear .t2{color:var(--gold);text-shadow:3px 3px 0 var(--ink),0 0 34px rgba(255,209,102,.6)}
@keyframes bannerIn{0%{opacity:0;transform:translateY(18px) scale(.92);filter:blur(4px)}12%{opacity:1;transform:none;filter:none}78%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-14px)}}
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,40,80,.55) 100%);transition:opacity .5s}
#hurt.on{opacity:1;transition:opacity .05s}

/* ---------- screens ---------- */

#pick{flex-direction:column;gap:26px}

#pick .sub{margin:0;color:var(--dim);font-size:13px;text-align:center}
#pick .sub kbd{font-family:var(--f-pix);font-size:9px;color:var(--fg)}
#cards{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;perspective:900px}
.card{--rc:#b9c9a8;position:relative;width:214px;min-height:290px;padding:22px 18px 18px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;cursor:pointer;border:0;color:var(--fg);
  background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--rc),0 0 0 6px var(--ink),0 10px 0 6px rgba(0,0,0,.45);
  opacity:0;transform:translateY(60px) rotateX(35deg) scale(.9);transition:transform .35s cubic-bezier(.25,1.5,.45,1),box-shadow .25s,opacity .3s,filter .3s}
.card.in{opacity:1;transform:none}
.card.in:hover,.card.in.kb{transform:translateY(-12px) scale(1.04);box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--rc),0 0 0 6px var(--ink),0 18px 0 6px rgba(0,0,0,.4),0 0 44px 6px color-mix(in srgb,var(--rc) 40%,transparent)}
.card.picked{transform:translateY(-30px) scale(1.12)!important;transition:transform .5s cubic-bezier(.2,1.4,.4,1),opacity .5s .25s}
.card.out{opacity:0!important;transform:translateY(40px) scale(.85)!important;filter:blur(2px)}
.card.rare{--rc:var(--vio)}
.card.special{--rc:#ff7ac8}
.card.nova{--rc:#5fe3ff}

.card.form.in:not(.out),.card.epic.in:not(.out){animation:cardGlow 1.8s ease-in-out infinite}
@keyframes cardGlow{50%{filter:drop-shadow(0 0 16px color-mix(in srgb,var(--rc) 60%,transparent))}}
.card p em{font-style:normal;font-weight:700;color:var(--rc)}
.card small{font-size:11px;color:var(--dim);letter-spacing:.05em}
.card small.fnote{color:#ffb38a;line-height:1.5}
.cd-form{font-family:var(--f-body);font-size:12px;font-weight:700}
.card.epic{--rc:var(--gold)}
.card .rar{font-family:var(--f-pix);font-size:8px;letter-spacing:.15em;color:var(--rc)}
.card canvas{width:84px;height:84px;image-rendering:pixelated;filter:drop-shadow(0 0 12px color-mix(in srgb,var(--rc) 55%,transparent))}
.card h3{margin:0;font-family:var(--f-head);font-weight:400;font-size:26px;letter-spacing:.08em}

.card .lv i{width:8px;height:8px;background:#2a3f30;box-shadow:0 0 0 1px var(--ink)}
.card .lv i.on{background:var(--rc)}
.card .lv i.new{background:#fff;animation:blink .6s steps(2) infinite}
.card .key{position:absolute;top:8px;left:10px;font-family:var(--f-pix);font-size:8px;color:var(--dim)}
@keyframes blink{50%{background:var(--rc)}}

/* ---------- intro comic ---------- */
#comic{background:radial-gradient(ellipse at center,rgba(15,26,20,.88),rgba(8,14,10,.97));cursor:pointer}
.comic-page{width:min(980px,100%);display:flex;flex-direction:column;align-items:center;gap:14px}
#comic-grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{position:relative;aspect-ratio:16/10;max-width:100%;background:#fdf6e3;padding:5px;box-sizing:border-box;
  box-shadow:0 0 0 3px #160f24,8px 8px 0 3px rgba(0,0,0,.45);
  opacity:0;transform:translateY(40px) scale(.82) rotate(calc(var(--tilt) * 4));transition:transform .55s cubic-bezier(.2,1.5,.4,1),opacity .35s,box-shadow .35s,filter .4s}
.panel.in{opacity:1;transform:rotate(var(--tilt));filter:brightness(.82) saturate(.85)}
.panel.in.cur{filter:none;box-shadow:0 0 0 3px #160f24,0 0 0 7px var(--gold),10px 10px 0 5px rgba(0,0,0,.45)}
.panel.instant{transition-duration:.12s}
.panel::after{content:"";position:absolute;inset:5px;background:#fff;opacity:0;pointer-events:none}
.panel.in.cur::after{animation:panelFlash .45s ease-out}
@keyframes panelFlash{0%{opacity:.9}100%{opacity:0}}
.panel canvas{display:block;width:100%;height:100%;image-rendering:pixelated;border:2px solid #160f24;box-sizing:border-box}
.panel .cap{position:absolute;left:12px;right:12px;bottom:12px;min-height:1.6em;padding:6px 10px;background:#fff8dc;color:#1d1a12;font-size:clamp(12px,1.5vw,15px);font-weight:700;line-height:1.5;
  box-shadow:0 0 0 2px #160f24,3px 3px 0 2px rgba(0,0,0,.35);opacity:0;transition:opacity .2s}
.panel .cap:not(:empty){opacity:1}
.panel:nth-child(odd) .cap{right:30%}
.panel:nth-child(even) .cap{left:30%}
.panel .caret{display:inline-block;width:.5em;height:1em;margin-left:2px;vertical-align:-2px;background:#1d1a12;animation:blinkCaret .5s steps(2) infinite}
@keyframes blinkCaret{50%{opacity:0}}
.comic-hint{margin:0;font-size:12px;color:var(--dim);letter-spacing:.15em;animation:hintPulse 1.6s ease-in-out infinite;transition:color .3s,font-size .3s}
.comic-hint.ready{font-family:var(--f-head);font-size:22px;color:var(--gold);letter-spacing:.25em;text-shadow:2px 2px 0 var(--ink),0 0 16px rgba(255,209,102,.55);animation:hintReady 1.2s ease-in-out infinite}
@keyframes hintReady{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:.6;transform:translateY(-3px)}}
@keyframes hintPulse{50%{opacity:.45}}
@media (max-width:640px){#comic{align-items:flex-start}#comic-grid{grid-template-columns:1fr}.panel:nth-child(n) .cap{left:12px;right:12px}}

/* ---------- reroll + nine-gift grid ---------- */
.reroll{display:flex;align-items:center;gap:10px;font-size:18px;padding:8px 20px 7px}
.reroll b{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--dim)}
.reroll kbd{font-family:var(--f-pix);font-size:8px;padding:2px 4px;background:var(--ink);box-shadow:0 0 0 1px var(--gild,#c99a45)}
.reroll .dice{width:18px;height:18px;background:#fff3c4;box-shadow:0 0 0 2px var(--ink);position:relative;transform:rotate(-8deg);transition:transform .4s}
.reroll .dice::before,.reroll .dice::after{content:"";position:absolute;width:4px;height:4px;background:var(--ink)}
.reroll .dice::before{left:3px;top:3px;box-shadow:8px 8px 0 var(--ink)}
.reroll .dice::after{left:7px;top:7px}
.reroll:hover:not(:disabled) .dice{transform:rotate(200deg)}
.reroll:disabled{opacity:.4;cursor:default;transform:none;box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--line),0 4px 0 4px #26402c}
#pick.grid9{justify-content:flex-start;padding-block:24px 18px;gap:16px}
#pick.grid9 #cards{display:grid;grid-template-columns:repeat(3,214px);gap:22px;max-height:calc(100vh - 230px);overflow-y:auto;padding:18px 22px 30px;perspective:none;
  scrollbar-width:thin;scrollbar-color:var(--gold) rgba(15,26,20,.6)}

/* ---------- NPC dialogue ---------- */
#dialog{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));width:min(720px,calc(100% - 32px));display:flex;align-items:center;gap:16px;padding:14px 22px 14px 14px;box-sizing:border-box;cursor:pointer;
  background:linear-gradient(#21382a,#16251c);box-shadow:0 0 0 2px var(--ink),0 0 0 4px #c99a45,0 0 0 6px var(--ink),6px 8px 0 6px rgba(0,0,0,.35);
  transform:translate(-50%,40px);opacity:0;transition:transform .45s cubic-bezier(.2,1.3,.4,1),opacity .3s}
#dialog.on{transform:translateX(-50%);opacity:1}
.dlg-face{flex:none;width:72px;height:72px;background:radial-gradient(circle at 40% 35%,#e8fbff,#7fc8e8 70%,#3a6f8f);box-shadow:0 0 0 2px var(--ink),0 0 0 4px #a8e8ff}
.dlg-face canvas{display:block;width:72px;height:72px;image-rendering:pixelated;animation:float 2.4s ease-in-out infinite}
.dlg-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.dlg-name{font-family:var(--f-head);font-size:19px;letter-spacing:.12em;color:#a8e8ff;text-shadow:2px 2px 0 var(--ink)}

.slot.ult{border:0}

function buildPillar(th, variant) {

function drawTufts(x0, y0, x1, y1) {
  const T = arena.theme.tuft, vis = [];
  for (const tf of arena.tufts) {
    if (tf.y < y0) continue; if (tf.y > y1) break; if (tf.x < x0 || tf.x > x1) continue;
    let [s, gu] = windAt(tf.x, tf.y, G.t);
    if (!player.dead) {
      const dx = tf.x - player.x, dy = (tf.y - player.y) * 1.6, d2 = dx * dx + dy * dy;
      if (d2 < 140) s += (dx >= 0 ? 1 : -1) * 3.2 * (1 - Math.sqrt(d2) / 12);
    }
    vis.push(tf, s, gu);
  }
  // one pass per colour keeps fillStyle switches low
  for (let pass = 0; pass < 3; pass++) {
    ctx.fillStyle = T[pass];
    for (let i = 0; i < vis.length; i += 3) {
      const tf = vis[i], s = vis[i + 1];
      for (let b = 0; b < tf.n; b++) {
        const bx = tf.x + b * 2 - tf.n + 1, hh = tf.h - (b & 1);
        for (let k = 0; k < hh; k++) {
          const lvl = k === hh - 1 ? 2 : k >= hh / 2 ? 1 : 0;
          if (lvl !== pass) continue;
          ctx.fillRect(bx + Math.round(s * Math.pow(k / hh, 1.4) * hh / 3.5), tf.y - k, 1, 1);
        }

    }
  }
  // gust fronts catch the light on the blade tips; flowers ride on top
  ctx.fillStyle = T[3];
  for (let i = 0; i < vis.length; i += 3) { const tf = vis[i], s = vis[i + 1], gu = vis[i + 2]; if (gu > .3) ctx.fillRect(tf.x + Math.round(s * tf.h / 3.5), tf.y - tf.h + 1, 1, 1); }
  for (let i = 0; i < vis.length; i += 3) {
    const tf = vis[i]; if (!tf.fl) continue;
    const s = vis[i + 1], fx = tf.x + Math.round(s * tf.h / 3.2), fy = tf.y - tf.h - 1;
    ctx.fillStyle = tf.fl; ctx.fillRect(fx - 1, fy, 3, 1); ctx.fillRect(fx, fy - 1, 1, 3);
    ctx.fillStyle = tf.fl === '#ffe066' ? '#ffffff' : '#ffe066'; ctx.fillRect(fx, fy, 1, 1);
  }
}

  const shown = txt.slice(0, Math.floor(comic.typed));

  if (comic.typed >= txt.length) {

      if (AU.gate('spiral', 60)) sfx.shoot();
      p.fireCd += 1 / fireRate(); if (p.fireCd < 0) p.fireCd = 0;
    }
    return true;
  }
  if (evoBr('boomer', 'B')) {
    const want = canFire && mouse.down ? 78 : 26;
    EV.bladeR = damp(EV.bladeR, want, canFire && mouse.down ? 3 : 6, dt);
    return true;
  }
  if (evoBr('sing', 'B')) {
    if (canFire && mouse.down) {
      if (!EV.held || EV.held.dead) {
        const [hx, hy] = handPos(p.aim);
        spawnProj(hx, hy, p.aim, { dmgMul: .6, sizeMul: 2.2, spdMul: .2, lifeMul: 99, sing: true, held: true });
        EV.held = projs[projs.length - 1]; if (EV.held) EV.held.holdT = 0;
        afterCast(); AU.tone(220, .5, 'sine', .08, 110);
      }
      EV.held.holdT += dt;
      if (EV.held.holdT >= 6) { EV.held.held = false; EV.held.life = 0; EV.held = null; }
    } else if (EV.held) {
      if (!EV.held.dead) EV.held.life = 0;
      EV.held = null;
    }
    return true;
  }
  if (evoBr('meteor', 'B')) {
    if (canFire && p.fireCd <= 0) {
      const live = enemies.filter(e => !e.dead && e.spawnT >= 1 && !e.ghost && dist(e, p) < 280);
      if (live.length) {
        const pri = live.filter(e => e.type === 'boss' || e.elite);
        const t = (pri.length ? pri : live).sort((a, b) => dist(a, p) - dist(b, p))[0];
        castMeteor(1, t.x, t.y); afterCast();
        p.fireCd += 1 / fireRate(); if (p.fireCd < 0) p.fireCd = 0;
      }
    }
    return true;
  }
  return false;
}

/* 星爆冲击波: an instant cone that hits everything in front and erases bullets */
function castWave(a, mul) {
  const p = player, R = 95 * (evoLv('shotgun') >= 2 ? 1.5 : 1) * Math.sqrt(spell.speed / 230), half = .87;
  const dmg = spell.dmg * 2 * spell.count * mul * (evoLv('shotgun') >= 1 ? 1.5 : 1) * slowBonus(), hs = new Set();
  for (const e of enemies) {
    if (e.dead || e.spawnT < 1 || e.ghost) continue;
    const d = dist(e, p); if (d > R + e.r) continue;
    const da = Math.abs(angDiff(a, angTo(p, e))); if (da > half && d > e.r + 6) continue;
    hs.add(e);
    hitEnemy(e, { x: p.x, y: p.y, vx: e.x - p.x || 1, vy: e.y - p.y, dmg, elem: elemOf(), gen: 0, hit: hs, kb: 4 });
  }
  for (const b of eprojs) {
    if (b.friendly || b.dead) continue;
    const d = Math.hypot(b.x - p.x, b.y - p.y);
    if (d < R && Math.abs(angDiff(a, Math.atan2(b.y - p.y, b.x - p.x))) < half) { b.dead = true; addPart(b.x, b.y, 6, 0, 0, 20, .3, ['#ffffff', '#ffd166'], 1, { add: true }); }
  }
  EV.waves.push({ x: p.x, y: p.y - 4, a, R, half, t: 0, max: .32 });
  p.vx -= Math.cos(a) * 60; p.vy -= Math.sin(a) * 60;
  addShake(.25); cam.kx -= Math.cos(a) * 5; cam.ky -= Math.sin(a) * 5;
  AU.noise(.3, .25, 1200, 200, 1); AU.tone(120, .25, 'square', .1, 50);
}

/* 流星雨 and the lava pools */
function meteorShower() {
  for (let i = 0; i < 8; i++) {
    const off = rand(TAU), r = rand(18, 70);
    meteors.push({ x: clamp(mouse.wx + Math.cos(off) * r, 6, arena.w - 6), y: clamp(mouse.wy + Math.sin(off) * r * .7, 6, arena.h - 6), t: -.15 - i * .06, max: .4, R: 16 * Math.sqrt(spell.size), dmg: spell.dmg * 2.4 * slowBonus(), el: elemOf(), bounces: 0, small: true });
  }
  AU.tone(1500, .4, 'sine', .05, 400);
}
function meteorLava(m) {
  const n = 6;
  for (let i = 0; i < n; i++) { const a = i / n * TAU + rand(.3), r = m.R * rand(.15, .55); flames.push({ x: m.x + Math.cos(a) * r, y: m.y + Math.sin(a) * r * .62, t: 0, max: 2, hit: new Map(), lava: true }); }
  flames.push({ x: m.x, y: m.y, t: 0, max: 2, hit: new Map(), lava: true });
}

/* dash hooks: 流星翼 contact damage, 星翼残影 turrets */
function evoOnDash() {
  player.dashHit = new Set();
  if (evoBr('wing', 'B')) EV.turrets.push({ x: player.x, y: player.y, t: 0, max: 3, cd: .15 });
}

function updateEvo(dt) {
  const p = player;
  if (!spell.form) { if (EV.blades.length || EV.turrets.length) evoReset(); return; }
  // 流星翼
  if (evoBr('wing', 'A') && p.dashT > 0 && p.dashHit) {
    for (const e of enemies) {
      if (e.dead || e.spawnT < 1 || e.ghost || p.dashHit.has(e) || dist(e, p) > e.r + 9) continue;
      p.dashHit.add(e);
      damageEnemy(e, spell.dmg * 3 * slowBonus(), p.x, p.y, { kb: 220, dir: angTo(p, e), crit: true });
      sparkBurst(e.x, e.y - 4, ['#ffffff', '#ff9ec7', '#c94f8a'], 8);
    }
  }
  // 星翼残影
  for (const t of EV.turrets) {
    t.t += dt; t.cd -= dt;
    if (t.cd <= 0) {
      let best = null, bd = 210;
      for (const e of enemies) { if (e.dead || e.spawnT < 1 || e.ghost) continue; const d = Math.hypot(e.x - t.x, e.y - t.y); if (d < bd) { bd = d; best = e; } }
      if (best) { t.cd = .2; const a = Math.atan2(best.y - t.y, best.x - t.x); for (let i = 0; i < spell.count; i++) spawnProj(t.x, t.y - 6, a + (spell.count > 1 ? (i / (spell.count - 1) - .5) * .4 : 0), { dmgMul: .8 }); if (AU.gate('turret', 70)) AU.tone(1300, .04, 'triangle', .03, 1700); }
      else t.cd = .1;
    }
  }
  EV.turrets = EV.turrets.filter(t => t.t < t.max);
  // 月轮护卫
  if (evoBr('boomer', 'B')) {
    const n = spell.count + 2, spd = 2.6 + spell.rate * .25, dmg = spell.dmg * (evoLv('boomer') >= 1 ? 2.25 : 1.5) * slowBonus();
    while (EV.blades.length < n) EV.blades.push({ a: 0, x: p.x, y: p.y });
    EV.blades.length = n;
    const base = (EV.bladeA = (EV.bladeA || 0) + dt * spd);
    const r = EV.bladeR * Math.sqrt(spell.size), br = 5 * Math.sqrt(spell.size) * (evoLv('boomer') >= 1 ? 1.3 : 1);
    EV.blades.forEach((b, i) => {
      b.a = base + i / n * TAU; b.x = p.x + Math.cos(b.a) * r; b.y = p.y - 4 + Math.sin(b.a) * r * .75;
      for (const e of enemies) {
        if (e.dead || e.spawnT < 1 || e.ghost) continue;
        if (Math.hypot(e.x - b.x, e.y - 4 - b.y) > e.r + br) continue;
        if (G.t < (e.bladeT || 0)) continue;
        e.bladeT = G.t + .2;
        hitEnemy(e, { x: b.x, y: b.y, vx: Math.cos(b.a + Math.PI / 2), vy: Math.sin(b.a + Math.PI / 2), dmg, elem: elemOf(), gen: 0, hit: new Set([e]), kb: .5 }, { chainChance: .25 });
        if (AU.gate('blade', 45)) AU.tone(rand(1700, 2000), .03, 'square', .025);
      }
    });
  } else if (EV.blades.length) EV.blades = [];
  for (const w of EV.waves) w.t += dt;
  EV.waves = EV.waves.filter(w => w.t < w.max);
}

/* held singularity follows the cursor */
function evoHeldSing(p, dt) {
  const dx = mouse.wx - p.x, dy = mouse.wy - p.y, d = Math.hypot(dx, dy) || 1, sp = Math.min(d * 4, 150);
  p.vx = damp(p.vx, dx / d * sp, 6, dt); p.vy = damp(p.vy, dy / d * sp, 6, dt);
  p.life = Math.max(p.life, 1);
  p.r = 2.4 * spell.size * 2.2 * (1 + Math.min(1, (p.holdT || 0) * .15));
}

function drawEvoAir() {
  const p = player;
  // 极光聚能: shield while the first 4s of charge last
  if (evoBr('laser', 'A') && p.charge > 0 && (p.chargeHeld || 0) < 4 && !p.dead) {
    const k = 1 - (p.chargeHeld || 0) / 4;
    ctx.globalAlpha = .35 + .3 * k; ctx.fillStyle = '#fff3c4'; pixRing(p.x, p.y - 6, 14 + Math.sin(G.t * 12), .9, 1);
    ctx.globalAlpha = .12; pixDisc(p.x, p.y - 6, 13, .9); ctx.globalAlpha = 1;
  }
  for (const t of EV.turrets) {
    const a = t.t < .15 ? t.t / .15 : t.t > t.max - .4 ? (t.max - t.t) / .4 : 1;
    ctx.save(); ctx.globalAlpha = .6 * a; ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(glowTex('#ff9ec7'), t.x - 14, t.y - 22, 28, 28);
    ctx.translate(snap(t.x), snap(t.y)); ctx.drawImage(SPR.mageGhost, -6, -17); ctx.restore();
  }
  if (EV.blades.length) {
    const c = ELEM[elemOf()], r = 4 * Math.sqrt(spell.size) * (evoLv('boomer') >= 1 ? 1.3 : 1);
    for (const b of EV.blades) {
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .5; ctx.drawImage(glowTex(c[1]), b.x - r * 3, b.y - r * 3, r * 6, r * 6);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      ctx.save(); ctx.translate(snap(b.x), snap(b.y)); ctx.rotate(G.t * 16 + b.a);
      ctx.fillStyle = c[2]; ctx.fillRect(-r * 1.6, -1.5, r * 3.2, 3); ctx.fillRect(-1.5, -r * 1.6, 3, r * 3.2);
      ctx.fillStyle = c[1]; ctx.fillRect(-r * 1.3, -.5, r * 2.6, 1); ctx.fillRect(-.5, -r * 1.3, 1, r * 2.6);
      ctx.fillStyle = c[0]; ctx.fillRect(-1, -1, 2, 2); ctx.restore();
    }
  }
  for (const w of EV.waves) {
    const k = w.t / w.max, rr = w.R * easeOutCubic(Math.min(1, k * 1.4));
    ctx.globalAlpha = 1 - k;
    for (let ring = 0; ring < 3; ring++) {
      const R = rr * (1 - ring * .18); ctx.fillStyle = ring ? '#ffd166' : '#ffffff';
      for (let b = -w.half; b <= w.half; b += .06) ctx.fillRect(Math.round(w.x + Math.cos(w.a + b) * R), Math.round(w.y + Math.sin(w.a + b) * R * .8), ring ? 1 : 2, ring ? 1 : 2);
    }
    ctx.globalAlpha = 1;
  }
}

/* ================= no healing while the star demon rages ================= */
function canHeal() { return !(G.ult && G.ult.active === 'demon'); }

/* ================= 汲魂: every heal raises the bar by 2 ================= */
function leechKill() {
  if (!spell.leech) return;
  G.leechN = Math.min((G.leechN || 0) + 1, G.leechNeed || 25);
  tryLeech();
}
function tryLeech() {
  if (!spell.leech || (G.leechN || 0) < (G.leechNeed || 25) || player.hp >= player.maxHp || !canHeal() || player.dead) return;
  G.leechN = 0; G.leechNeed = (G.leechNeed || 25) + 2;
  healPlayer(1);
  addText(player.x, player.y - 32, '汲魂', '#ff8aa0', .9);
}
let leechShown = '';
function updateLeechHud() {
  const el = $('leech'); if (!el) return;
  const on = !!spell.leech && G.state !== 'menu';
  const key = on ? `${G.leechN}/${G.leechNeed}/${canHeal()}` : '';
  if (key === leechShown) return; leechShown = key;
  el.hidden = !on; if (!on) return;
  const need = G.leechNeed || 25, n = G.leechN || 0;
  $('leech-t').textContent = !canHeal() ? '汲魂 · 星魔化身中无法回复' : n >= need ? `汲魂 · 已就绪，受伤后立即回复` : `汲魂 · 击杀 ${need} 个敌人回复 1 颗心`;
  $('leech-n').textContent = `${n}/${need}`;
  $('leech-b').style.width = (n / need * 100) + '%';
  el.classList.toggle('ready', n >= need);
}

/* ================= frost: frozen enemies soak enemy bullets ================= */
function frostHit(e) {
  if (e.type === 'boss' || e.elite) { e.slowT = 1 + spell.frost; return; }
  if (e.frozen > 0 || G.t < (e.frostImm || 0)) return;
  e.frozen = .6 + .4 * spell.frost; e.frostImm = G.t + e.frozen + 1;
  for (let i = 0; i < 6; i++) addPart(e.x, e.y - 4, 6, rand(-30, 30), rand(-20, 20), rand(20, 60), .45, ['#ffffff', '#c6f6ff', '#5fb0ff'], 1, { add: true, g: 120 });
}
function frostBlock(b) {
  for (const e of enemies) {
    if (!(e.frozen > 0) || e.dead || e.spawnT < 1) continue;
    if (Math.hypot(b.x - e.x, b.y - (e.y - 6)) > e.r + b.r + 3) continue;
    b.dead = true;
    for (let i = 0; i < 6; i++) addPart(b.x, b.y - 6, 6, rand(-50, 50), rand(-40, 40), rand(20, 60), .35, ['#ffffff', '#c6f6ff', '#5fb0ff'], 1, { add: true, g: 150 });
    damageEnemy(e, spell.dmg, b.x, b.y, { tcol: '#c6f6ff', kb: 10, fixed: true });
    if (AU.gate('iceblock', 50)) AU.tone(2200, .06, 'triangle', .04, 1400);
    return true;
  }
  return false;
}

/* ================= weaker effects option ================= */
// ctx.globalAlpha is wrapped so a whole block of effect drawing can be dimmed without touching every draw call
const GA_DESC = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, 'globalAlpha');
let FX_MUL = 1;
Object.defineProperty(ctx, 'globalAlpha', { configurable: true, get() { return GA_DESC.get.call(this) / FX_MUL; }, set(v) { GA_DESC.set.call(this, v * FX_MUL); } });
G.weakFx = false;
try { G.weakFx = localStorage.getItem('sv-weakfx') === '1'; } catch (e) {}
function fxDim(on) { const a = ctx.globalAlpha; FX_MUL = on && G.weakFx ? .5 : 1; ctx.globalAlpha = on ? 1 : a; }
function setWeakFx(on) { G.weakFx = on; try { localStorage.setItem('sv-weakfx', on ? '1' : '0'); } catch (e) {} }

/* ================= pause menu: the whole build ================= */
function tierOfPick(u, m) { return u.kind === 'stat' ? (m >= 2 ? 'epic' : m >= 1.4 ? 'rare' : 'common') : u.kind; }
function buildEntries() {
  const out = [], seen = new Map();
  if (G.ult) {
    const U = ULTS[G.ult.id];
    out.push({ ico: ultIcon(G.ult.id), name: U.name, tag: '大魔法', col: '#ff7a3d', desc: U.desc });
  }
  if (spell.form) {
    const f = spell.form, u = UPGRADES.find(x => x.id === f), lv = spell.formLv || 0, ev = EVO[f];
    const lines = [u.desc(1)];
    if (lv >= 1) lines.push(`进化 I · ${ev.l1.name}：${ev.l1.desc()}`);
    if (lv >= 2) lines.push(`进化 II · ${ev.l2.name}：${ev.l2.desc()}`);
    if (lv >= 3) { const b = ev[spell.formBr]; lines.push(`进化 III · ${b.name}：${b.desc()}`); }
    out.push({ ico: iconCanvas(u, 'form'), name: FORMS[f].name, tag: lv ? `武器形态 · Lv.${lv}` : '武器形态', col: RAR.form.col, desc: lines.join('<br>') });
  }
  for (const h of G.history) {
    const u = UPGRADES.find(x => x.id === h.id);
    if (!u || u.kind === 'form' || u.kind === 'evo') continue;
    const tier = tierOfPick(u, h.m), key = u.id + '|' + tier;
    if (seen.has(key)) { seen.get(key).n++; continue; }
    const it = { ico: iconCanvas(u, tier), name: u.name, tag: RAR[tier].label, col: RAR[tier].col, desc: u.desc(h.m, 0), n: 1, kind: u.kind };
    seen.set(key, it); out.push(it);
  }
  return out;
}
function renderBuildList() {
  const list = $('build-list'); if (!list) return;
  const items = buildEntries();
  $('build-n').textContent = items.length ? `${G.history.length} 张` : '';
  list.innerHTML = items.length ? '' : '<p class="build-empty">还没有获得任何强化</p>';
  for (const it of items) {
    const el = document.createElement('div'); el.className = 'bc'; el.style.setProperty('--rc', it.col);
    const c = it.ico; c.className = 'bc-ico'; el.appendChild(c);
    el.insertAdjacentHTML('beforeend', `<div class="bc-body"><div class="bc-top"><b>${it.name}${it.n > 1 ? ` <span class="bc-n">×${it.n}</span>` : ''}</b><em>${it.tag}</em></div><p>${it.desc}</p></div>`);
    list.appendChild(el);
  }
  $('weakfx-cb').checked = !!G.weakFx;
}
$('weakfx-cb').addEventListener('change', e => setWeakFx(e.target.checked));

</script>
